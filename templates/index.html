<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Receitas</title>
</head>

<body>

<h1>Receitas</h1>

<input id="termo" placeholder="Receita ou ingrediente">
<button onclick="buscarReceitas(1, true)">Buscar</button>

<ul id="receitas"></ul>

<button id="anterior" onclick="buscarReceitas(pagina - 1)">Anterior</button>
<span id="pagina"></span>
<button id="proxima" onclick="buscarReceitas(pagina + 1)">Próxima</button>


<h2>Usuários</h2>

<input id="nome" placeholder="Nome do usuário">
<button onclick="buscarUsuarios()">Buscar</button>

<ul id="usuarios"></ul>


<script>

let pagina = 1;
let termo = "";


async function buscarReceitas(numero, novaBusca = false) {

    if (novaBusca) {
        termo = document.getElementById("termo").value;
    }

    let url = "/api/receitas";

    if (termo) {
        url += "/busca/" + encodeURIComponent(termo);
    }

    const resposta = await fetch(url + "?page=" + numero);
    const dados = await resposta.json();

    pagina = dados.pagina;

    document.getElementById("receitas").innerHTML =
        dados.receitas.map(r => `
            <li>
                <b>${r.titulo}</b><br>
                ${r.descricao}<br>
                Ingredientes: ${r.ingredientes}<br>
                Autor: <a href="/perfil/${r.usuario_id}">${r.autor}</a>
            </li>
        `).join("");

    document.getElementById("pagina").textContent =
        "Página " + pagina;

    document.getElementById("anterior").disabled =
        pagina <= 1;

    document.getElementById("proxima").disabled =
        pagina >= dados.paginas;
}


async function buscarUsuarios() {

    const nome = document.getElementById("nome").value;

    if (!nome) return;

    const resposta = await fetch(
        "/api/usuarios/busca/" + encodeURIComponent(nome)
    );

    const dados = await resposta.json();

    document.getElementById("usuarios").innerHTML =
        dados.map(u => `
            <li>
                <a href="/perfil/${u.id}">${u.nome}</a>
            </li>
        `).join("");
}


buscarReceitas(1);

</script>

</body>
</html>
