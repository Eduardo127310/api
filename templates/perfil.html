<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Perfil</title>
</head>

<body>

<a href="/">Voltar</a>

<h1 id="nome"></h1>
<p id="email"></p>

<h2>Receitas</h2>
<ul id="receitas"></ul>


<script>

// Segurança: converte < > & em texto comum antes de colocar no HTML (proteção contra XSS).
function escapar(texto) {
    const div = document.createElement("div");
    div.textContent = texto;
    return div.innerHTML;
}


async function carregarPerfil() {

    const resposta = await fetch(
        "/api/usuarios/{{ usuario_id }}"
    );

    const dados = await resposta.json();

    if (!resposta.ok) {
        document.getElementById("nome").textContent = dados.erro;
        return;
    }

    document.getElementById("nome").textContent =
        dados.usuario.nome;

    document.getElementById("email").textContent =
        dados.usuario.email;

    document.getElementById("receitas").innerHTML =
        dados.receitas.map(r => `
            <li>
                <b>${escapar(r.titulo)}</b><br>
                ${escapar(r.descricao)}<br>
                Ingredientes: ${escapar(r.ingredientes)}<br>
                Modo de preparo: ${escapar(r.modo_preparo)}
            </li>
        `).join("");
}


carregarPerfil();

</script>

</body>
</html>
