<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Perfil</title>
    <style>
        body { font-family: Arial; max-width: 800px; margin: 30px auto; padding: 15px; }
        li { margin-bottom: 20px; white-space: pre-line; }
    </style>
</head>
<body>
    <a href="/">Voltar para as buscas</a>
    <h1 id="nome">Perfil</h1>
    <p id="email"></p>
    <h2>Receitas publicadas</h2>
    <ul id="receitas"></ul>
    <script>
        async function carregarPerfil() {
            const resposta = await fetch("/api/usuarios/{{ usuario_id }}");
            if (!resposta.ok) {
                document.getElementById("nome").textContent = "Não foi possível carregar o perfil.";
                return;
            }
            const dados = await resposta.json();
            document.getElementById("nome").textContent = dados.usuario.nome;
            document.getElementById("email").textContent = dados.usuario.email;
            const lista = document.getElementById("receitas");
            lista.textContent = dados.receitas.length ? "" : "Nenhuma receita publicada.";
            for (const receita of dados.receitas) {
                const item = document.createElement("li");
                item.textContent = receita.titulo + "\n" + receita.descricao +
                    "\nIngredientes: " + receita.ingredientes +
                    "\nPreparo: " + receita.modo_preparo;
                lista.appendChild(item);
            }
        }
        carregarPerfil();
    </script>
</body>
</html>
